name: MarketKita syntax check
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Parse inline JavaScript in index.html
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script[^>]*>([\\s\S]*?)<\/script>/gi)].map(m=>m[1]);
          console.log('inline scripts:',scripts.length);
          for (let i=0;i<scripts.length;i++) {
            try { new Function(scripts[i]); console.log('OK script',i+1); }
            catch(e) { console.error('FAIL script',i+1,e.stack||e); process.exitCode=1; }
          }
          if(process.exitCode) process.exit(1);
          NODE
      - name: Install Playwright test dependency
        run: npm install --no-audit --no-fund
      - name: P25 final production audit smoke tests
        run: |
          npx playwright test tests/priority25.spec.mjs
      - name: P26 production readiness and payment smoke tests
        run: |
          npx playwright test tests/priority26.spec.mjs
      - name: P27 Seller Center smoke tests
        run: |
          npx playwright test tests/priority27.spec.mjs
      - name: P28 Buyer Experience smoke tests
        run: |
          npx playwright test tests/priority28.spec.mjs
      - name: P29 Promotion Engine smoke tests
        run: |
          npx playwright test tests/priority29.spec.mjs

      - name: P30 Search & Discovery smoke tests
        run: |
          npx playwright test tests/priority30.spec.mjs
      - name: P31 Marketplace Finance smoke tests
        run: |
          npx playwright test tests/priority31.spec.mjs
      - name: P32 Trust & Safety smoke tests
        run: |
          npx playwright test tests/priority32.spec.mjs
      - name: P33 Performance & Scale smoke tests
        run: |
          npx playwright test tests/priority33.spec.mjs
      - name: G4 Promotion Engine smoke tests
        run: |
          npx playwright test tests/g4-promotion.spec.mjs
      - name: G5 Seller Growth smoke tests
        run: |
          npx playwright test tests/g5-seller-growth.spec.mjs

      - name: G6 Customer Loyalty smoke tests
        run: |
          npx playwright test tests/g6-loyalty.spec.mjs
