<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MarketKita — G10 Marketplace BI</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:#f6f7f9;color:#1f2937}main{max-width:1200px;margin:0 auto;padding:24px}.top{display:flex;justify-content:space-between;gap:12px;align-items:end;flex-wrap:wrap}.top h1{margin:0}.filters{display:flex;gap:8px;align-items:end;flex-wrap:wrap}label{display:grid;gap:4px;font-size:12px}input,button{padding:9px 11px;border:1px solid #d1d5db;border-radius:8px;background:#fff}button{cursor:pointer;font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}.card,.panel{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px}.card span{font-size:12px;color:#6b7280}.card strong{display:block;font-size:22px;margin-top:6px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel h2{font-size:16px;margin:0 0 12px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:8px;border-bottom:1px solid #eee;text-align:left}.table th:last-child,.table td:last-child{text-align:right}.muted{color:#6b7280;font-size:12px}.error{padding:12px;background:#fee2e2;border-radius:8px;color:#991b1b}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.cols{grid-template-columns:1fr}}@media(max-width:480px){main{padding:14px}.grid{grid-template-columns:1fr}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/auth-guard.js"></script></head><body><main>
<div class="top"><div><h1>G10 Marketplace BI</h1><div class="muted">Business intelligence admin dari data transaksi MarketKita.</div></div>
<div class="filters"><label>Dari<input id="from" type="date"></label><label>Sampai<input id="to" type="date"></label><button id="refresh">Refresh</button><a href="/admin.html">← Admin</a></div></div>
<div id="msg"></div><section class="grid" id="kpi"></section><div class="cols"><section class="panel"><h2>Tren harian</h2><table class="table"><thead><tr><th>Tanggal</th><th>Order</th><th>Buyer</th><th>GMV</th></tr></thead><tbody id="daily"></tbody></table></section>
<section class="panel"><h2>Seller</h2><table class="table"><thead><tr><th>Seller</th><th>Order</th><th>Unit</th><th>GMV</th></tr></thead><tbody id="sellers"></tbody></table></section>
<section class="panel"><h2>Produk</h2><table class="table"><thead><tr><th>Produk</th><th>Order</th><th>Unit</th><th>GMV</th></tr></thead><tbody id="products"></tbody></table></section>
<section class="panel"><h2>Kategori</h2><table class="table"><thead><tr><th>Kategori</th><th>Order</th><th>Unit</th><th>GMV</th></tr></thead><tbody id="categories"></tbody></table></section>
<section class="panel"><h2>Pembayaran</h2><table class="table"><thead><tr><th>Metode</th><th>Order</th><th>GMV</th></tr></thead><tbody id="payments"></tbody></table></section>
<section class="panel"><h2>Health layanan</h2><div id="health"></div></section></div></main>
<script>
(()=>{"use strict";const $=id=>document.getElementById(id),rp=v=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(v||0)),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function dates(){const t=new Date(),f=new Date(t.getTime()-29*86400000);$("from").value=f.toISOString().slice(0,10);$("to").value=t.toISOString().slice(0,10)}
async function token(){const r=await window.KWAuth.requireRole("admin",{loginUrl:"/?account=login"});return r?.client?((await r.client.auth.getSession())?.data?.session?.access_token||""):""}
async function load(){const msg=$("msg");msg.innerHTML="";try{let tok=await token();if(!tok){const key=Object.keys(localStorage).find(k=>/supabase/i.test(k));if(key){try{const x=JSON.parse(localStorage.getItem(key));tok=x?.access_token||x?.currentSession?.access_token||""}catch{}}}if(!tok)throw Error("Sesi admin tidak ditemukan.");
 const q=new URLSearchParams({from:$("from").value,to:$("to").value});const r=await fetch("/api/marketplace-bi?"+q,{headers:{Authorization:"Bearer "+tok},cache:"no-store"});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Gagal memuat BI.");const x=d.data||{},k=x.kpi||{};
 $("kpi").innerHTML=[["GMV",rp(k.gmv)],["Order",k.orders],["Buyer",k.buyers],["AOV",rp(k.aov)],["Selesai",k.completed_orders],["Platform fee",rp(k.platform_fee)],["Ongkir",rp(k.shipping_fee)],["Diskon",rp(k.discount)]].map(a=>'<div class="card"><span>'+a[0]+'</span><strong>'+esc(a[1])+'</strong></div>').join("");
 const rows=(arr,label,fields)=>$(label).innerHTML=(arr||[]).map(o=>'<tr>'+fields.map(f=>'<td>'+esc(f[1]?f[1](o[f[0]]):o[f[0]])+'</td>').join("")+"</tr>").join("");
 rows(x.daily,"daily",[["day_label"],["orders"],["buyers"],["gmv",rp]]);rows(x.sellers,"sellers",[["name"],["orders"],["units"],["gmv",rp]]);rows(x.products,"products",[["name"],["orders"],["units"],["gmv",rp]]);rows(x.categories,"categories",[["category"],["orders"],["units"],["gmv",rp]]);rows(x.payments,"payments",[["payment_type"],["orders"],["gmv",rp]]);
 const h=x.service_health||{};$("health").innerHTML=["refunds","returns","disputes","reviews"].map(n=>{const z=h[n]||{};return '<div class="card" style="margin-bottom:8px"><b>'+esc(n)+'</b><div class="muted">request/review: '+esc(z.requests??z.reviews??0)+' · '+(n==="refunds"?"amount "+rp(z.amount):n==="reviews"?"rating "+esc(z.avg_rating):"open "+esc(z.open_requests))+'</div></div>'}).join("");
}catch(e){msg.innerHTML='<div class="error">'+esc(e.message)+"</div>"}}
dates();$("refresh").addEventListener("click",load);load();
})();</script></body></html>
