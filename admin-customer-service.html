<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MarketKita — Customer Service Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#f6f8fb;color:#172033}
.wrap{max-width:1180px;margin:0 auto;padding:28px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.head h1{margin:0;font-size:22px}.head p{margin:5px 0 0;color:#738096;font-size:12px}
button{border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer}.refresh{background:#edf4ff;color:#1670e8}.logout{background:#fff1f1;color:#c43c3c}
.grid{display:grid;grid-template-columns:340px 1fr;gap:16px}.card{background:#fff;border:1px solid #e4e9ef;border-radius:14px;padding:14px}.card h2{font-size:14px;margin:0 0 12px}.tickets{display:grid;gap:8px;max-height:70vh;overflow:auto}.ticket{width:100%;text-align:left;background:#fff;border:1px solid #e3e8ef;padding:11px;border-radius:10px}.ticket.active{border-color:#1976e8;background:#f5f9ff}.ticket b{display:block;font-size:11px}.ticket span{display:block;color:#758095;font-size:10px;margin-top:4px}.badge{display:inline-block;border-radius:999px;padding:3px 7px;font-size:9px;background:#fff2d8;color:#9a6800;margin-top:6px}.messages{height:54vh;overflow:auto;background:#f8fafc;border:1px solid #e6ebf0;border-radius:12px;padding:12px}.bubble{max-width:75%;padding:9px 11px;border-radius:11px;margin:7px 0;font-size:12px;line-height:1.5}.customer{background:#fff;border:1px solid #e0e5eb}.admin{margin-left:auto;background:#1670e8;color:#fff}.bubble small{display:block;opacity:.6;font-size:9px;margin-top:4px}.compose{display:flex;gap:8px;margin-top:10px}.compose input{flex:1;border:1px solid #dce2e9;border-radius:9px;padding:11px}.compose button{background:#1670e8;color:#fff}.approve{background:#1670e8;color:#fff;margin-top:10px;width:100%}.empty{text-align:center;color:#7b8797;padding:30px;font-size:12px}.error{padding:14px;background:#fff0f0;color:#a42f2f;border-radius:10px;margin-bottom:12px}
@media(max-width:800px){.wrap{padding:15px}.grid{grid-template-columns:1fr}.messages{height:45vh}}
</style></head>
<body><div class="wrap">
<div class="head"><div><h1>Customer Service</h1><p>Kelola tiket, persetujuan, dan percakapan manual Customer Service.</p></div><div><button class="refresh" id="refresh">↻ Refresh</button> <button class="logout" id="logout">Keluar</button></div></div>
<div id="error"></div>
<div class="grid"><div class="card"><h2>Menunggu Persetujuan</h2><div id="tickets" class="tickets"></div></div>
<div class="card"><h2 id="chatTitle">Pilih tiket</h2><div id="chat" class="messages"><div class="empty">Pilih tiket untuk melihat percakapan.</div></div><div id="action"></div><form id="compose" class="compose" style="display:none"><input id="input" maxlength="4000" placeholder="Balas customer..."><button>Kirim</button></form></div></div>
</div>
<script>
let sb,user,profile,selected=null,timer;
const esc=v=>String(v??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const COOKIE_PREFIX="mk_auth_",CHUNK=3600;
const storage={getItem(k){const a=[];for(let i=0;i<20;i++){const v=document.cookie.split("; ").find(x=>x.startsWith(COOKIE_PREFIX+k+"_"+i+"="));if(!v)break;a.push(decodeURIComponent(v.split("=").slice(1).join("=")));}return a.join("")||null},setItem(k,v){for(let i=0;i<20;i++)document.cookie=COOKIE_PREFIX+k+"_"+i+"=; Max-Age=0; Path=/; SameSite=Lax";const enc=encodeURIComponent(v);for(let i=0;i<Math.ceil(enc.length/CHUNK);i++)document.cookie=COOKIE_PREFIX+k+"_"+i+"="+enc.slice(i*CHUNK,(i+1)*CHUNK)+"; Max-Age=31536000; Path=/; SameSite=Lax"},removeItem(k){for(let i=0;i<20;i++)document.cookie=COOKIE_PREFIX+k+"_"+i+"=; Max-Age=0; Path=/; SameSite=Lax"}};
async function init(){try{const cfg=await fetch("/api/public-config",{cache:"no-store"}).then(r=>r.json());sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,storage}});const s=await sb.auth.getSession();user=s.data.session?.user;if(!user)throw Error("Silakan login sebagai Admin terlebih dahulu.");const p=await sb.from("profiles").select("*").eq("id",user.id).single();profile=p.data;if(profile?.role!=="admin")throw Error("Akses ditolak. Halaman ini hanya untuk Admin.");await load();timer=setInterval(load,5000)}catch(e){document.getElementById("error").innerHTML='<div class="error">'+esc(e.message)+'</div>';}}
async function load(){const q=await sb.from("cs_threads").select("*,profiles:customer_id(full_name,phone)").in("ticket_status",["waiting_admin","active"]).order("updated_at",{ascending:false});if(q.error){document.getElementById("error").innerHTML='<div class="error">'+esc(q.error.message)+'</div>';return}renderTickets(q.data||[]);if(selected)await openTicket(selected.id,false)}
function renderTickets(rows){const root=document.getElementById("tickets");if(!rows.length){root.innerHTML='<div class="empty">Tidak ada tiket.</div>';return}root.innerHTML=rows.map(t=>'<button class="ticket '+(selected?.id===t.id?"active":"")+'" data-id="'+t.id+'"><b>'+esc(t.ticket_number||"Tanpa nomor")+'</b><span>'+esc(t.profiles?.full_name||"Customer")+'</span><span>'+esc(t.subject||"Bantuan Customer Service")+'</span><span class="badge">'+(t.ticket_status==="waiting_admin"?"MENUNGGU":"AKTIF")+'</span></button>').join("");root.querySelectorAll(".ticket").forEach(b=>b.onclick=()=>openTicket(b.dataset.id,true))}
async function openTicket(id,rerender=true){const q=await sb.from("cs_threads").select("*,profiles:customer_id(full_name,phone)").eq("id",id).single();if(q.error)return;selected=q.data;if(rerender)renderTickets([selected,...[]]);document.getElementById("chatTitle").textContent=(selected.ticket_number||"Tiket")+" · "+(selected.profiles?.full_name||"Customer");const m=await sb.from("cs_messages").select("*").eq("thread_id",id).order("created_at",{ascending:true});const chat=document.getElementById("chat");chat.innerHTML=(m.data||[]).map(x=>'<div class="bubble '+(x.sender_role==="admin"?"admin":"customer")+'">'+esc(x.body)+'<small>'+new Date(x.created_at).toLocaleString("id-ID")+(x.is_bot?" · otomatis":"")+'</small></div>').join("")||'<div class="empty">Belum ada pesan.</div>';chat.scrollTop=chat.scrollHeight;const action=document.getElementById("action");if(selected.ticket_status==="waiting_admin")action.innerHTML='<button class="approve" onclick="approveTicket()">✓ Setujui Tiket & Mulai Chat Manual</button>';else action.innerHTML='<div style="font-size:11px;color:#198754;padding:8px 0">🟢 Tiket aktif. Customer dan Admin dapat membalas secara manual.</div>';document.getElementById("compose").style.display=selected.ticket_status==="active"?"flex":"none"}
async function approveTicket(){if(!selected)return;const r=await sb.from("cs_threads").update({ticket_status:"active",assigned_admin_id:user.id,approved_at:new Date().toISOString(),updated_at:new Date().toISOString(),last_message_at:new Date().toISOString()}).eq("id",selected.id).eq("ticket_status","waiting_admin");if(r.error){alert(r.error.message);return}selected.ticket_status="active";selected.assigned_admin_id=user.id;await sb.from("cs_messages").insert({thread_id:selected.id,sender_id:user.id,sender_role:"admin",is_bot:false,body:"Halo, saya Admin Customer Service MarketKita. Tiket Anda sudah disetujui. Silakan lanjutkan percakapan di sini."});await openTicket(selected.id);await load()}
document.getElementById("compose").onsubmit=async e=>{e.preventDefault();if(!selected||selected.ticket_status!=="active")return;const input=document.getElementById("input"),body=input.value.trim();if(!body)return;const r=await sb.from("cs_messages").insert({thread_id:selected.id,sender_id:user.id,sender_role:"admin",is_bot:false,body});if(r.error){alert(r.error.message);return}await sb.from("cs_threads").update({updated_at:new Date().toISOString(),last_message_at:new Date().toISOString()}).eq("id",selected.id);input.value="";openTicket(selected.id,false)};
document.getElementById("refresh").onclick=load;document.getElementById("logout").onclick=async()=>{await sb.auth.signOut();location.href="/"};
init();
</script></body></html>
