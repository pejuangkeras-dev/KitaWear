<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Password Reset — KitaWear</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background:
        linear-gradient(135deg, #f5f1e8, #e7e3da);
      color: #111;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: #fff;
      border-radius: 24px;
      padding: 36px;
      box-shadow: 0 20px 60px rgba(0,0,0,.12);
    }

    .logo {
      width: 54px;
      height: 54px;
      border: 2px solid #111;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      letter-spacing: -.5px;
    }

    .description {
      margin: 0 0 28px;
      color: #666;
      font-size: 14px;
      line-height: 1.6;
    }

    label {
      display: block;
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      margin-bottom: 18px;
      border: 1px solid #d7d7d7;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #111;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 15px;
      background: #111;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      display: block;
      background: #edf9f0;
      color: #16703a;
    }

    .error {
      display: block;
      background: #fff0f0;
      color: #b42318;
    }

    .warning {
      margin-top: 20px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #fff8e6;
      color: #7a5b00;
      font-size: 12px;
      line-height: 1.5;
    }

    .back {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #555;
      text-decoration: none;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">K</div>

    <h1>Reset Password Admin</h1>

    <p class="description">
      Gunakan halaman sementara ini untuk mengganti password
      akun admin KitaWear.
    </p>

    <form id="resetForm">

      <label for="userId">
        Admin User ID
      </label>

      <input
        id="userId"
        type="text"
        autocomplete="off"
        placeholder="Masukkan User ID admin"
        required
      >

      <label for="resetToken">
        Reset Token
      </label>

      <input
        id="resetToken"
        type="password"
        autocomplete="off"
        placeholder="Masukkan ADMIN_RESET_TOKEN"
        required
      >

      <label for="newPassword">
        Password Baru
      </label>

      <input
        id="newPassword"
        type="password"
        autocomplete="new-password"
        minlength="6"
        placeholder="Minimal 6 karakter"
        required
      >

      <label for="confirmPassword">
        Konfirmasi Password Baru
      </label>

      <input
        id="confirmPassword"
        type="password"
        autocomplete="new-password"
        minlength="6"
        placeholder="Ulangi password baru"
        required
      >

      <button id="submitButton" type="submit">
        Simpan Password Baru
      </button>

    </form>

    <div id="message" class="message"></div>

    <div class="warning">
      Halaman ini hanya untuk pemulihan admin.
      Setelah password berhasil diubah, halaman dan function
      reset sementara sebaiknya dihapus.
    </div>

    <a class="back" href="/admin">
      Kembali ke Admin KitaWear
    </a>

  </main>

  <script>
    const form = document.getElementById("resetForm");
    const button = document.getElementById("submitButton");
    const message = document.getElementById("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const userId =
        document.getElementById("userId").value.trim();

      const resetToken =
        document.getElementById("resetToken").value;

      const newPassword =
        document.getElementById("newPassword").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (newPassword.length < 6) {
        showMessage(
          "Password minimal 6 karakter.",
          "error"
        );
        return;
      }

      if (newPassword !== confirmPassword) {
        showMessage(
          "Konfirmasi password tidak sama.",
          "error"
        );
        return;
      }

      if (!userId || !resetToken) {
        showMessage(
          "User ID dan Reset Token wajib diisi.",
          "error"
        );
        return;
      }

      button.disabled = true;
      button.textContent = "Menyimpan...";

      try {

        const response = await fetch(
          "/api/admin-reset-password",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
              "Authorization":
                "Bearer " + resetToken
            },

            body: JSON.stringify({
              userId,
              newPassword
            })
          }
        );

        const text = await response.text();

        let result = {};

        try {
          result = JSON.parse(text);
        } catch {
          result = {
            error: "Response server tidak valid."
          };
        }

        if (!response.ok) {
          throw new Error(
            result.error ||
            "Gagal mengubah password."
          );
        }

        showMessage(
          "Password admin berhasil diubah. Kamu sekarang bisa login menggunakan password baru.",
          "success"
        );

        form.reset();

        button.textContent = "Password Berhasil Diubah";

      } catch (error) {

        showMessage(
          error.message ||
          "Terjadi kesalahan saat mengubah password.",
          "error"
        );

        button.disabled = false;
        button.textContent = "Simpan Password Baru";
      }
    });
  </script>

</body>
</html>
