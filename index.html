let cart=[];

const rupiah=n=>
  new Intl.NumberFormat(
    "id-ID",
    {
      style:"currency",
      currency:"IDR",
      maximumFractionDigits:0
    }
  ).format(n);


/* =========================
   SEARCH
========================= */

function openSearch(){

  const modal=document.getElementById("searchModal");
  const input=document.getElementById("siteSearch");

  if(!modal || !input) return;

  modal.classList.add("show");
  modal.setAttribute("aria-hidden","false");

  input.value="";

  filterProducts("");

  setTimeout(()=>{
    input.focus();
  },50);

}


function closeSearch(e){

  const modal=document.getElementById("searchModal");

  if(!modal) return;

  if(e && e.target!==modal) return;

  modal.classList.remove("show");

  modal.setAttribute("aria-hidden","true");

}


function filterProducts(query){

  const q=(query||"")
    .trim()
    .toLowerCase();

  const cards=
    document.querySelectorAll("#products .card");

  let shown=0;

  cards.forEach(card=>{

    const text=
      card.textContent.toLowerCase();

    const match=
      !q || text.includes(q);

    card.style.display=
      match ? "" : "none";

    card.classList.remove(
      "search-highlight"
    );

    if(match) shown++;

  });


  const info=
    document.getElementById(
      "searchResultInfo"
    );

  if(info){

    info.textContent=
      q
        ? (
            shown
              ? `${shown} produk ditemukan.`
              : "Produk tidak ditemukan."
          )
        : "Ketik untuk mencari produk.";

  }

}


/* =========================
   RENDER PRODUCTS
========================= */

function render(){

  document.getElementById("products").innerHTML=

    products.map((p,i)=>`

      <article class="card">

        <div
          class="photo"
          onclick="openLightbox(${i})">

          <img
            src="${p.img}"
            alt="${p.name}"
            loading="lazy"
            onerror="this.style.display='none'">

          ${
            p.badge
              ? `<span class="badge">${p.badge}</span>`
              : ""
          }

        </div>

        <div class="body">

          <h3>${p.name}</h3>

          <div class="price">
            ${rupiah(p.price)}
          </div>

          <div class="swatches">

            ${
              p.colors.map(c=>
                `<span
                  class="sw"
                  style="background:${c}">
                </span>`
              ).join("")
            }

          </div>

          <div class="sizes-label">
            Pilih ukuran:
          </div>

          <select
            class="size-select"
            id="size-${i}"
            aria-label="Ukuran ${p.name}">

            <option value="">
              Pilih ukuran
            </option>

            ${
              p.sizes.map(s=>
                `<option value="${s}">
                  ${s}
                </option>`
              ).join("")
            }

          </select>

          <button
            class="smallbtn"
            id="add-${i}"
            onclick="add(${i})">
            🛒 &nbsp;Tambah ke Keranjang
          </button>

        </div>

      </article>

    `).join("");

}


/* =========================
   ADD TO CART
========================= */

function add(i){

  const size=
    document.getElementById(
      `size-${i}`
    ).value;

  if(!size){

    showKwNotice(
      `Silakan pilih ukuran untuk ${products[i].name}.`
    );

    document.getElementById(
      `size-${i}`
    ).focus();

    return;
  }


  cart.push({
    productIndex:i,
    name:products[i].name,
    price:products[i].price,
    size:size,
    quantity:1
  });


  updateCart();

  document
    .getElementById("drawer")
    .classList.add("show");

}


/* =========================
   CENTER NOTIFICATION
========================= */

let kwNoticeTimer=null;


function showKwNotice(
  message,
  title="Perlu dilengkapi"
){

  const overlay=
    document.getElementById(
      "kwNoticeOverlay"
    );

  const titleEl=
    document.getElementById(
      "kwNoticeTitle"
    );

  const messageEl=
    document.getElementById(
      "kwNoticeMessage"
    );

  const button=
    document.getElementById(
      "kwNoticeButton"
    );


  if(
    !overlay ||
    !titleEl ||
    !messageEl ||
    !button
  ){
    return;
  }


  titleEl.textContent=title;

  messageEl.textContent=message;

  button.focus();

  overlay.classList.add("show");

  overlay.setAttribute(
    "aria-hidden",
    "false"
  );

  clearTimeout(kwNoticeTimer);

}


function closeKwNotice(){

  const overlay=
    document.getElementById(
      "kwNoticeOverlay"
    );

  if(!overlay) return;

  overlay.classList.remove("show");

  overlay.setAttribute(
    "aria-hidden",
    "true"
  );

}


document.addEventListener(
  "keydown",
  e=>{

    if(e.key==="Escape"){

      const overlay=
        document.getElementById(
          "kwNoticeOverlay"
        );

      if(
        overlay?.classList.contains("show")
      ){
        closeKwNotice();
      }

    }

  }
);


/* =========================
   CART
========================= */

function updateCart(){

  document.getElementById("count")
    .textContent=
      cart.reduce(
        (s,x)=>s+x.quantity,
        0
      );


  document.getElementById(
    "cartItems"
  ).innerHTML=

    cart.length

      ? cart.map((x,i)=>`

          <div class="item">

            <div class="item-main">

              <div class="item-name">
                ${x.name}
              </div>

              <div class="item-meta">
                Ukuran:
                <strong>${x.size}</strong>
                · ${rupiah(x.price)}
              </div>

            </div>

            <div class="item-actions">

              <button
                class="qtybtn"
                onclick="changeQty(${i},-1)">
                −
              </button>

              <strong>
                ${x.quantity}
              </strong>

              <button
                class="qtybtn"
                onclick="changeQty(${i},1)">
                +
              </button>

              <button
                class="remove"
                onclick="removeItem(${i})">
                ×
              </button>

            </div>

          </div>

        `).join("")

      : "<p style='color:#666'>Keranjang masih kosong.</p>";


  document.getElementById("total")
    .textContent=
      rupiah(
        cart.reduce(
          (s,x)=>s+x.price*x.quantity,
          0
        )
      );

}


function changeQty(i,d){

  cart[i].quantity=
    Math.max(
      1,
      cart[i].quantity+d
    );

  updateCart();

}


function removeItem(i){

  cart.splice(i,1);

  updateCart();

}


function toggleCart(){

  document
    .getElementById("drawer")
    .classList.toggle("show");

  updateCart();

}


/* =========================
   WHATSAPP
========================= */

function openWA(msg){

  window.open(
    `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`,
    "_blank"
  );

}


function checkout(){

  if(!cart.length){

    showKwNotice(
      "Keranjang masih kosong.",
      "Keranjang kosong"
    );

    return;
  }


  const lines=

    cart.map(
      (x,i)=>
        `${i+1}. ${x.name} — Size ${x.size} — Qty ${x.quantity} — ${rupiah(x.price*x.quantity)}`
    ).join("\n");


  const total=
    cart.reduce(
      (s,x)=>s+x.price*x.quantity,
      0
    );


  openWA(
    `Halo KitaWear, saya ingin memesan:\n\n${lines}\n\nTotal: ${rupiah(total)}\n\nMohon konfirmasi stok dan pengiriman.`
  );

}


/* =========================
   CHECKOUT
========================= */

function openCheckout(){

  if(!cart.length){

    showKwNotice(
      "Keranjang masih kosong.",
      "Keranjang kosong"
    );

    return;
  }


  document.getElementById(
    "checkoutItems"
  ).innerHTML=

    cart.map(x=>`

      <div class="checkout-summary-row">

        <span>

          ${x.name}

          <br>

          <small>
            Size ${x.size}
            · Qty ${x.quantity}
          </small>

        </span>

        <span>
          ${rupiah(
            x.price*x.quantity
          )}
        </span>

      </div>

    `).join("");


  document.getElementById(
    "checkoutTotal"
  ).textContent=

    rupiah(
      cart.reduce(
        (s,x)=>s+x.price*x.quantity,
        0
      )
    );


  document
    .getElementById("checkoutModal")
    .classList.add("show");

  document
    .getElementById("checkoutModal")
    .setAttribute(
      "aria-hidden",
      "false"
    );

}


function closeCheckout(e){

  if(
    e &&
    e.target !==
      document.getElementById(
        "checkoutModal"
      )
  ){
    return;
  }


  document
    .getElementById("checkoutModal")
    .classList.remove("show");

  document
    .getElementById("checkoutModal")
    .setAttribute(
      "aria-hidden",
      "true"
    );

}


/* =========================
   MIDTRANS PAYMENT
========================= */

async function startPayment(e){

  e.preventDefault();


  if(!cart.length){

    showKwNotice(
      "Keranjang masih kosong.",
      "Keranjang kosong"
    );

    return;
  }


  const btn=
    document.getElementById(
      "payButton"
    );


  btn.disabled=true;

  btn.textContent=
    "Menyiapkan pembayaran...";


  try{

    const configRes=
      await fetch(
        "/.netlify/functions/config"
      );


    const config=
      await configRes.json();


    if(
      !configRes.ok ||
      !config.clientKey
    ){

      throw new Error(
        config.error ||
        "Konfigurasi pembayaran belum tersedia."
      );

    }


    if(!window.snap){

      await new Promise(
        (resolve,reject)=>{

          const s=
            document.createElement(
              "script"
            );

          s.src=config.snapUrl;

          s.setAttribute(
            "data-client-key",
            config.clientKey
          );

          s.onload=resolve;

          s.onerror=()=>{
            reject(
              new Error(
                "Gagal memuat Midtrans Snap."
              )
            );
          };

          document.head.appendChild(s);

        }
      );

    }


    const payload={

      customer:{

        name:
          document
            .getElementById(
              "buyerName"
            )
            .value
            .trim(),

        email:
          document
            .getElementById(
              "buyerEmail"
            )
            .value
            .trim(),

        phone:
          document
            .getElementById(
              "buyerPhone"
            )
            .value
            .trim(),

        address:
          document
            .getElementById(
              "buyerAddress"
            )
            .value
            .trim()

      },

      items:
        cart.map(
          x=>({
            name:x.name,
            size:x.size,
            quantity:x.quantity
          })
        )

    };


    const res=
      await fetch(
        "/.netlify/functions/create-transaction",
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:
            JSON.stringify(payload)
        }
      );


    const data=
      await res.json();


    if(
      !res.ok ||
      !data.token
    ){

      throw new Error(
        data.error ||
        "Gagal membuat transaksi."
      );

    }


    window.snap.pay(
      data.token,
      {

        onSuccess:function(){

          showKwNotice(
            "Pembayaran berhasil. Terima kasih sudah belanja di KitaWear!",
            "Pembayaran berhasil"
          );

        },

        onPending:function(){

          showKwNotice(
            "Pembayaran belum selesai. Silakan lanjutkan pembayaran sesuai instruksi Midtrans.",
            "Pembayaran tertunda"
          );

        },

        onError:function(){

          showKwNotice(
            "Pembayaran gagal. Silakan coba lagi.",
            "Pembayaran gagal"
          );

        },

        onClose:function(){}

      }
    );


  }catch(err){

    showKwNotice(
      err.message ||
      "Terjadi kesalahan saat menyiapkan pembayaran.",
      "Terjadi kesalahan"
    );

  }finally{

    btn.disabled=false;

    btn.textContent=
      "Lanjut ke Pembayaran";

  }

}


/* =========================
   LIGHTBOX
========================= */

let lightboxIndex=0;


function openLightbox(i){

  lightboxIndex=i;

  const p=products[i];

  const imgs=
    p.gallery || [p.img];


  document.getElementById(
    "lightboxImg"
  ).src=imgs[0];


  document.getElementById(
    "lightboxImg"
  ).alt=p.name;


  document.getElementById(
    "lightboxCaption"
  ).textContent=
    `${p.name} — ${rupiah(p.price)}`;


  document.getElementById(
    "lightboxThumbs"
  ).innerHTML=

    imgs.map(
      (src,j)=>
        `<img
          class="lightbox-thumb ${j===0?"active":""}"
          src="${src}"
          onclick="setLightboxImage(${i},${j},event)"
          alt="">`
    ).join("");


  document
    .getElementById("lightbox")
    .classList.add("show");

}


function setLightboxImage(i,j,e){

  if(e)
    e.stopPropagation();


  const p=products[i];

  const imgs=
    p.gallery || [p.img];


  document.getElementById(
    "lightboxImg"
  ).src=imgs[j];


  document
    .querySelectorAll(
      ".lightbox-thumb"
    )
    .forEach(
      (el,k)=>
        el.classList.toggle(
          "active",
          k===j
        )
    );

}


function changeLightbox(d){

  const p=
    products[lightboxIndex];

  const imgs=
    p.gallery || [p.img];


  let current=
    Array.from(
      document.querySelectorAll(
        ".lightbox-thumb"
      )
    ).findIndex(
      x=>x.classList.contains(
        "active"
      )
    );


  current=
    (current+d+imgs.length)
    %imgs.length;


  setLightboxImage(
    lightboxIndex,
    current
  );

}


function closeLightbox(e){

  if(
    e &&
    e.target !==
      document.getElementById(
        "lightbox"
      ) &&
    !e.currentTarget
      ?.classList
      .contains(
        "lightbox-close"
      )
  ){
    return;
  }


  document
    .getElementById("lightbox")
    .classList.remove("show");

}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
  "keydown",
  e=>{

    if(e.key==="Escape"){

      document
        .getElementById(
          "lightbox"
        )
        .classList.remove(
          "show"
        );

      document
        .getElementById(
          "checkoutModal"
        )
        .classList.remove(
          "show"
        );

    }


    if(
      e.key==="ArrowLeft" &&
      document
        .getElementById(
          "lightbox"
        )
        .classList
        .contains("show")
    ){

      changeLightbox(-1);

    }


    if(
      e.key==="ArrowRight" &&
      document
        .getElementById(
          "lightbox"
        )
        .classList
        .contains("show")
    ){

      changeLightbox(1);

    }

  }
);


/* =========================
   INITIALIZE
========================= */

render();

updateCart();


document
  .getElementById("siteSearch")
  ?.addEventListener(
    "input",
    e=>filterProducts(
      e.target.value
    )
  );


document.addEventListener(
  "keydown",
  e=>{

    if(e.key==="Escape"){
      closeSearch();
    }

  }
);

</script>
