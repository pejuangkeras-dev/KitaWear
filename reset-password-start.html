<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Verifikasi Reset Password — MarketKita</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background:
        radial-gradient(circle at top, #f5f5f0 0%, #e9e9e4 45%, #dcdcd7 100%);
      color: #111;
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 24px;
      padding: 38px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
      text-align: center;
    }

    .logo {
      width: 54px;
      height: 54px;
      margin: 0 auto 24px;
      border: 2px solid #111;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: 800;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: -0.5px;
    }

    p {
      margin: 0 auto 28px;
      color: #666;
      font-size: 15px;
      line-height: 1.6;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 16px 20px;
      background: #111;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.92;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
      transform: none;
    }

    .error {
      display: none;
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 12px;
      background: #fff0f0;
      color: #b42318;
      font-size: 14px;
      line-height: 1.5;
      text-align: left;
    }

    .back {
      display: inline-block;
      margin-top: 22px;
      color: #555;
      font-size: 14px;
      text-decoration: none;
    }

    .back:hover {
      color: #111;
    }

    .small {
      margin-top: 22px;
      margin-bottom: 0;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">K</div>

    <h1>Verifikasi Reset Password</h1>

    <p>
      Untuk keamanan akun MarketKita, klik tombol di bawah
      untuk melanjutkan proses pembuatan password baru.
    </p>

    <button id="continueButton" type="button">
      Lanjutkan Reset Password
    </button>

    <div id="errorMessage" class="error"></div>

    <a
      class="back"
      href="https://marketkita.pages.dev/admin"
    >
      Kembali ke Admin MarketKita
    </a>

    <p class="small">
      Jangan bagikan link reset password kepada orang lain.
    </p>

  </main>

  <script>
    (function () {

      const button = document.getElementById("continueButton");
      const errorMessage = document.getElementById("errorMessage");

      function showError(message) {
        errorMessage.textContent = message;
        errorMessage.style.display = "block";
        button.disabled = true;
      }

      try {

        const params = new URLSearchParams(
          window.location.search
        );

        const confirmationUrl =
          params.get("confirmation_url");

        if (!confirmationUrl) {
          showError(
            "Link reset password tidak lengkap. Silakan minta email reset password baru."
          );
          return;
        }

        let parsedUrl;

        try {
          parsedUrl = new URL(confirmationUrl);
        } catch (error) {
          showError(
            "Link reset password tidak valid."
          );
          return;
        }

        /*
         * Security check:
         * Hanya izinkan URL verifikasi Supabase
         * dari project MarketKita.
         */
        const allowedHost =
          "eczozutsjwkfgpyccou.supabase.co";

        if (parsedUrl.hostname !== allowedHost) {
          showError(
            "Link verifikasi tidak berasal dari server MarketKita."
          );
          return;
        }

        if (
          parsedUrl.pathname !== "/auth/v1/verify"
        ) {
          showError(
            "Format link reset password tidak valid."
          );
          return;
        }

        button.addEventListener("click", function () {

          button.disabled = true;
          button.textContent = "Membuka halaman reset...";

          /*
           * Token baru digunakan ketika pengguna
           * benar-benar menekan tombol.
           */
          window.location.href = confirmationUrl;

        });

      } catch (error) {

        showError(
          "Terjadi kesalahan saat membaca link reset password."
        );

      }

    })();
  </script>

</body>
</html>
