<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — MarketKita</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      background: #f6f3ec;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: #fff;
      border-radius: 22px;
      padding: 38px 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.10);
    }

    .logo {
      width: 48px;
      height: 48px;
      border: 2px solid #111;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      font-weight: 800;
      font-size: 20px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      margin: 0 0 28px;
      color: #666;
      line-height: 1.6;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      height: 50px;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 0 15px;
      font-size: 15px;
      outline: none;
      margin-bottom: 18px;
      background: #fff;
    }

    input:focus {
      border-color: #111;
    }

    button {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 12px;
      background: #111;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 13px 15px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      color: #b42318;
    }

    .message.success {
      display: block;
      background: #edf8f0;
      color: #16733b;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #555;
      text-decoration: none;
      font-size: 13px;
    }

    .back:hover {
      color: #111;
    }

    .loading {
      text-align: center;
      color: #666;
      font-size: 14px;
      padding: 20px 0;
    }

    #formArea {
      display: none;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">K</div>

    <h1>Buat Password Baru</h1>

    <p class="subtitle">
      Masukkan password baru untuk akun MarketKita Anda.
    </p>

    <div id="loading" class="loading">
      Memverifikasi tautan reset password...
    </div>

    <div id="formArea">

      <label for="password">
        Password baru
      </label>

      <input
        id="password"
        type="password"
        placeholder="Minimal 6 karakter"
        autocomplete="new-password"
      >

      <label for="passwordConfirm">
        Konfirmasi password
      </label>

      <input
        id="passwordConfirm"
        type="password"
        placeholder="Ulangi password baru"
        autocomplete="new-password"
      >

      <button
        id="saveButton"
        type="button">
        Simpan Password Baru
      </button>

      <div
        id="message"
        class="message">
      </div>

    </div>

    <a
      class="back"
      href="/admin">
      Kembali ke Admin MarketKita
    </a>

  </main>


  <script>

    let supabaseClient = null;


    const loading =
      document.getElementById("loading");

    const formArea =
      document.getElementById("formArea");

    const saveButton =
      document.getElementById("saveButton");

    const message =
      document.getElementById("message");


    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;

    }


    async function loadConfig() {

      const response =
        await fetch(
          "/api/public-config",
          {
            method: "GET",
            cache: "no-store",
            headers: {
              "Accept": "application/json"
            }
          }
        );


      const raw =
        await response.text();


      let config;


      try {

        config =
          JSON.parse(raw);

      } catch {

        throw new Error(
          "Konfigurasi MarketKita tidak valid."
        );

      }


      if (
        !response.ok ||
        config?.error
      ) {

        throw new Error(
          config?.error ||
          "Konfigurasi Supabase gagal dimuat."
        );

      }


      if (
        !config.supabaseUrl ||
        !config.supabaseAnonKey
      ) {

        throw new Error(
          "Konfigurasi Supabase belum lengkap."
        );

      }


      return config;

    }


    async function init() {

      try {

        const config =
          await loadConfig();


        supabaseClient =
          window.supabase.createClient(
            config.supabaseUrl,
            config.supabaseAnonKey,
            {
              auth: {
                detectSessionInUrl: true,
                persistSession: true,
                autoRefreshToken: true
              }
            }
          );


        /*
         * Supabase PKCE recovery:
         * email reset membawa ?code=...
         */

        const url =
          new URL(
            window.location.href
          );


        const code =
          url.searchParams.get("code");


        if (code) {

          const {
            error
          } =
            await supabaseClient
              .auth
              .exchangeCodeForSession(
                code
              );


          if (error) {
            throw error;
          }


          /*
           * Hapus code dari address bar
           * setelah berhasil diproses.
           */

          window.history.replaceState(
            {},
            document.title,
            window.location.pathname
          );

        }


        /*
         * Cek error yang dikirim melalui hash.
         */

        const hash =
          new URLSearchParams(
            window.location.hash
              .replace(/^#/, "")
          );


        const hashError =
          hash.get("error");

        const hashErrorCode =
          hash.get("error_code");

        const hashErrorDescription =
          hash.get("error_description");


        if (hashError) {

          let description =
            hashErrorDescription ||
            hashErrorCode ||
            hashError;


          try {

            description =
              decodeURIComponent(
                description.replace(
                  /\+/g,
                  " "
                )
              );

          } catch {}


          throw new Error(
            description
          );

        }


        /*
         * Tunggu session recovery.
         */

        let session = null;


        for (
          let i = 0;
          i < 10;
          i++
        ) {

          const result =
            await supabaseClient
              .auth
              .getSession();


          if (result.error) {
            throw result.error;
          }


          session =
            result.data.session;


          if (session) {
            break;
          }


          await new Promise(
            resolve =>
              setTimeout(
                resolve,
                300
              )
          );

        }


        if (!session) {

          throw new Error(
            "Tautan reset password tidak valid atau sudah kedaluwarsa."
          );

        }


        loading.style.display =
          "none";

        formArea.style.display =
          "block";


      } catch (error) {

        loading.style.display =
          "none";

        formArea.style.display =
          "block";


        saveButton.disabled =
          true;


        showMessage(
          error?.message ||
          "Tautan reset password tidak dapat digunakan.",
          "error"
        );

      }

    }


    saveButton.addEventListener(
      "click",
      async () => {

        const password =
          document
            .getElementById(
              "password"
            )
            .value;


        const passwordConfirm =
          document
            .getElementById(
              "passwordConfirm"
            )
            .value;


        message.className =
          "message";

        message.textContent =
          "";


        if (
          password.length < 6
        ) {

          showMessage(
            "Password harus memiliki minimal 6 karakter.",
            "error"
          );

          return;

        }


        if (
          password !==
          passwordConfirm
        ) {

          showMessage(
            "Konfirmasi password tidak sama.",
            "error"
          );

          return;

        }


        saveButton.disabled =
          true;

        saveButton.textContent =
          "Menyimpan...";


        try {

          const {
            error
          } =
            await supabaseClient
              .auth
              .updateUser({
                password:
                  password
              });


          if (error) {
            throw error;
          }


          showMessage(
            "Password berhasil diperbarui. Silakan masuk kembali ke Admin MarketKita.",
            "success"
          );


          saveButton.textContent =
            "Password Berhasil Diubah";


          setTimeout(
            () => {

              window.location.href =
                "/admin";

            },
            1800
          );


        } catch (error) {

          showMessage(
            error?.message ||
            "Password gagal diperbarui.",
            "error"
          );


          saveButton.disabled =
            false;

          saveButton.textContent =
            "Simpan Password Baru";

        }

      }
    );


    init();

  </script>

</body>
</html>
