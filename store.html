<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111311">
<title>MarketKita — Toko</title>
<style>
:root{--bg:#f7f5f0;--paper:#fffdf9;--ink:#171817;--muted:#77736c;--line:#ded9cf;--dark:#111311}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}.container{width:min(1180px,92%);margin:auto}
.nav{position:sticky;top:0;z-index:20;background:rgba(255,253,249,.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.nav-inner{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px}.logo{font-size:23px;font-weight:950;letter-spacing:-.04em}.back{border:1px solid var(--line);background:#fffdf9;border-radius:11px;padding:10px 14px;font-weight:800}
.hero{padding:38px 0 22px}.store-card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:30px;display:flex;align-items:center;justify-content:space-between;gap:25px}.store-main{display:flex;align-items:center;gap:18px}.avatar{width:72px;height:72px;border-radius:20px;background:var(--dark);color:#fff;display:grid;place-items:center;font-size:28px;font-weight:950}.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#858078;font-weight:900}.store-name{margin:5px 0;font-size:34px;letter-spacing:-.055em}.store-desc{margin:0;color:var(--muted);line-height:1.6;max-width:680px}.store-meta{margin-top:9px;font-size:12px;color:#666}
.section{padding:20px 0 70px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.head h2{margin:0;font-size:30px;letter-spacing:-.05em}.head span{font-size:12px;color:var(--muted)}
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{background:var(--paper);border:1px solid var(--line);border-radius:17px;overflow:hidden}.photo{aspect-ratio:4/5;background:#ece8e0}.photo img{width:100%;height:100%;object-fit:cover}.body{padding:15px}.body h3{margin:0 0 7px;font-size:15px}.price{font-weight:900}.btn{width:100%;margin-top:12px;height:42px;border:0;border-radius:10px;background:var(--dark);color:#fff;font-weight:850}.empty,.loading{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px;background:var(--paper)}
@media(max-width:900px){.products{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.store-card{align-items:flex-start;flex-direction:column}.store-name{font-size:28px}.products{grid-template-columns:repeat(2,1fr);gap:12px}}@media(max-width:430px){.products{grid-template-columns:1fr}}
</style>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/marketkita-pwa.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/marketkita-pwa.svg">
<meta name="theme-color" content="#171817">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MarketKita">
</head>
<body>
<header class="nav"><div class="container nav-inner"><a href="/" class="logo">MarketKita</a><a href="/" class="back">← Kembali ke Marketplace</a></div></header>
<main>
<section class="hero"><div class="container"><div id="storeCard" class="store-card"><div class="loading">Memuat toko...</div></div></div></section>
<section class="section"><div class="container"><div class="head"><h2>Produk dari toko ini</h2><span id="productCount"></span></div><div id="products" class="products"></div></div></section>
</main>
<script>
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
const rupiah=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(n||0));
const slug=new URLSearchParams(location.search).get("slug")||"";
let products=[];
function renderStore(){
  const store=products.find(p=>p.store?.slug===slug)?.store;
  const card=document.getElementById("storeCard");
  if(!store){card.innerHTML='<div class="empty" style="width:100%">Toko tidak ditemukan atau belum memiliki produk aktif.</div>';document.getElementById("products").innerHTML="";return;}
  const name=store.name||"MarketKita Store", initial=name.trim().charAt(0).toUpperCase()||"M";
  card.innerHTML='<div class="store-main"><div class="avatar">'+esc(initial)+'</div><div><div class="eyebrow">Official Seller Store</div><h1 class="store-name">'+esc(name)+'</h1><p class="store-desc">'+esc(store.description||"Selamat datang di toko MarketKita.")+'</p><div class="store-meta">@'+esc(store.slug||slug)+' · '+products.length+' produk aktif</div></div></div><a class="back" href="/#produk">Belanja Produk</a>';
  const root=document.getElementById("products");
  root.innerHTML=products.length?products.map(p=>'<article class="card"><div class="photo"><img src="'+esc(p.image_url||p.img||"")+'" alt="'+esc(p.name)+'"></div><div class="body"><h3>'+esc(p.name)+'</h3><div class="price">'+rupiah(p.price)+'</div><button class="btn" onclick="goProduct(\''+encodeURIComponent(p.id||"")+'\')">Lihat Produk</button></div></article>').join(""):'<div class="empty" style="grid-column:1/-1">Belum ada produk aktif.</div>';
  document.getElementById("productCount").textContent=products.length+" produk";
}
function goProduct(id){location.href="/?store="+encodeURIComponent(slug)+"#produk";}
async function init(){
  try{
    if(!slug)throw new Error("Slug toko tidak ditemukan.");
    const r=await fetch("/api/public-products",{cache:"no-store"});
    const data=await r.json();
    if(!r.ok||!Array.isArray(data.products))throw new Error(data.error||"Produk tidak tersedia.");
    products=data.products.filter(p=>String(p.store?.slug||"")===slug);
    renderStore();
  }catch(e){
    document.getElementById("storeCard").innerHTML='<div class="empty" style="width:100%">Gagal memuat toko: '+esc(e.message||"Terjadi kesalahan.")+'</div>';
  }
}
init();
</script>
<script src="/pwa-p35.js?v=20261003-p35"></script>
</body>
</html>
